<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Article">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Article">
  <meta property="og:description" content="Article">
  <meta property="og:url" content="/post.html">
  <meta property="og:site_name" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Article">
  <meta name="twitter:description" content="Article">
  <title>Article</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <link rel="alternate" type="application/rss+xml" href="./data/feed.xml">
</head>
<body data-page="article">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-name" href="./index.html" data-site-name aria-label="Home"></a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main id="main-content" class="shell page-space">
    <article id="post-root" class="article-wrap" aria-live="polite">
      <div class="article-status">Loading article...</div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© <span data-current-year></span> <span data-site-name></span></p>
      <p data-footer-text>Powered By GlintLog.</p>
      <nav class="social-links" aria-label="Social links" data-social-links hidden></nav>
    </div>
  </footer>

  <!-- TODO: Umami / Plausible analytics script placeholder. -->
  <!-- TODO: Giscus comments placeholder. -->
  <!-- TODO: PWA: register service worker here when manifest.json and sw.js exist. -->
  <!-- TODO: Newsletter: Buttondown / ConvertKit embed placeholder below the article if enabled. -->
  <script defer src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>
  <script defer src="./js/app.js?v=4"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.4/lib/index.umd.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script defer src="./js/post.js?v=2"></script>
</body>
</html>
