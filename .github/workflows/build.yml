name: Build Static Blog Indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  # Full URL of the website (replace with your actual domain)
  SITE_URL: https://your-domain.example

  # Display name of the website (modify as needed)
  SITE_NAME: xxx

  # Brief description of the website (modify as needed)
  SITE_DESCRIPTION: xxx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3A: Generate posts.json.
      - name: Generate posts.json
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { promises as fs } from 'node:fs';
          import path from 'node:path';

          const POSTS_DIR = path.resolve('posts');
          const OUT_DIR = path.resolve('data');

          await fs.mkdir(OUT_DIR, { recursive: true });

          function parseScalar(raw) {
            const value = raw.trim();

            if (value === 'true') return true;
            if (value === 'false') return false;

            if (
              (value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'"))
            ) {
              return value
                .slice(1, -1)
                .replace(/\\(["'])/g, '$1');
            }

            if (value.startsWith('[') && value.endsWith(']')) {
              return value
                .slice(1, -1)
                .split(',')
                .map(item => item.trim())
                .filter(Boolean)
                .map(parseScalar);
            }

            return value;
          }

          function parseFrontmatter(source) {
            const normalized = source
              .replace(/^\uFEFF/, '')
              .replace(/\r\n?/g, '\n');

            if (!normalized.startsWith('---\n')) {
              throw new Error('Missing YAML frontmatter');
            }

            const end = normalized.indexOf('\n---', 4);

            if (end === -1) {
              throw new Error('Unclosed YAML frontmatter');
            }

            const data = {};

            for (
              const line of normalized
                .slice(4, end)
                .split('\n')
            ) {
              const trimmed = line.trim();

              if (!trimmed || trimmed.startsWith('#')) {
                continue;
              }

              const match = trimmed.match(
                /^([A-Za-z0-9_-]+):\s*(.*)$/
              );

              if (!match) {
                throw new Error(
                  `Unsupported frontmatter line: ${line}`
                );
              }

              data[match[1]] = parseScalar(match[2]);
            }

            return data;
          }

          const entries = await fs.readdir(
            POSTS_DIR,
            { withFileTypes: true }
          );

          const posts = [];

          for (const entry of entries) {
            if (
              !entry.isFile() ||
              !entry.name.endsWith('.md')
            ) {
              continue;
            }

            const slug = entry.name.slice(0, -3);

            if (
              !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)
            ) {
              throw new Error(
                `Invalid slug: ${slug}. Use lowercase English letters, numbers, and hyphens only.`
              );
            }

            const source = await fs.readFile(
              path.join(POSTS_DIR, entry.name),
              'utf8'
            );

            const frontmatter =
              parseFrontmatter(source);

            if (frontmatter.draft === true) {
              continue;
            }

            if (
              !frontmatter.title ||
              !frontmatter.date
            ) {
              throw new Error(
                `${entry.name}: title and date are required.`
              );
            }

            const date = new Date(
              frontmatter.date
            );

            if (Number.isNaN(date.getTime())) {
              throw new Error(
                `${entry.name}: invalid ISO date: ${frontmatter.date}`
              );
            }

            const tags = Array.isArray(
              frontmatter.tags
            )
              ? frontmatter.tags.map(String)
              : [];

            posts.push({
              slug,
              title: String(
                frontmatter.title
              ),
              date: String(
                frontmatter.date
              ),
              tags,
              summary: String(
                frontmatter.summary || ''
              )
            });
          }

          posts.sort(
            (a, b) =>
              new Date(b.date) -
              new Date(a.date)
          );

          await fs.writeFile(
            path.join(
              OUT_DIR,
              'posts.json'
            ),
            JSON.stringify(
              posts,
              null,
              2
            ) + '\n',
            'utf8'
          );

          console.log(
            `Generated posts.json with ${posts.length} published posts.`
          );
          NODE

      # Step 3B: Generate RSS feed with full article content.
      - name: Generate feed.xml
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { promises as fs } from 'node:fs';
          import path from 'node:path';

          const SITE_URL =
            process.env.SITE_URL.replace(/\/$/, '');

          const SITE_NAME =
            process.env.SITE_NAME;

          const SITE_DESCRIPTION =
            process.env.SITE_DESCRIPTION;

          const POSTS_DIR =
            path.resolve('posts');

          const posts = JSON.parse(
            await fs.readFile(
              path.resolve('data/posts.json'),
              'utf8'
            )
          );

          const escapeXml = value =>
            String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&apos;');

          const escapeCdata = value =>
            String(value ?? '')
              .replaceAll(
                ']]>',
                ']]]]><![CDATA[>'
              );

          const items = await Promise.all(
            posts.map(async post => {
              const link =
                `${SITE_URL}/post.html?slug=${encodeURIComponent(post.slug)}`;

              const articlePath =
                path.join(
                  POSTS_DIR,
                  `${post.slug}.md`
                );

              let articleSource = '';

              try {
                articleSource =
                  await fs.readFile(
                    articlePath,
                    'utf8'
                  );
              } catch (error) {
                console.warn(
                  `Unable to read article: ${articlePath}`
                );
              }

              /*
               * Remove YAML frontmatter from the RSS content.
               * The RSS reader should receive only the article body.
               */
              articleSource =
                articleSource.replace(
                  /^\uFEFF?---\s*[\s\S]*?\r?\n---\s*\r?\n/,
                  ''
                ).trim();

              return [
                '    <item>',
                `      <title>${escapeXml(post.title)}</title>`,
                `      <link>${escapeXml(link)}</link>`,
                `      <description>${escapeXml(post.summary)}</description>`,
                `      <pubDate>${escapeXml(new Date(post.date).toUTCString())}</pubDate>`,
                `      <guid isPermaLink="true">${escapeXml(link)}</guid>`,
                `      <content:encoded><![CDATA[${escapeCdata(articleSource)}]]></content:encoded>`,
                '    </item>'
              ].join('\n');
            })
          );

          const lastBuildDate =
            posts.length
              ? new Date(
                  posts[0].date
                ).toUTCString()
              : new Date().toUTCString();

          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<rss version="2.0" xmlns:content="http://purl.org/rss/1.0/modules/content/">',
            '  <channel>',
            `    <title>${escapeXml(SITE_NAME)}</title>`,
            `    <link>${escapeXml(SITE_URL + '/')}</link>`,
            `    <description>${escapeXml(SITE_DESCRIPTION)}</description>`,
            '    <language>en</language>',
            `    <lastBuildDate>${escapeXml(lastBuildDate)}</lastBuildDate>`,
            ...items,
            '  </channel>',
            '</rss>',
            ''
          ].join('\n');

          await fs.writeFile(
            path.resolve('data/feed.xml'),
            xml,
            'utf8'
          );

          console.log(
            `Generated feed.xml with ${posts.length} published items and full article content.`
          );
          NODE

      # Step 3C: Generate sitemap.xml.
      - name: Generate sitemap.xml
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { promises as fs } from 'node:fs';
          import path from 'node:path';

          const SITE_URL =
            process.env.SITE_URL.replace(/\/$/, '');

          const posts = JSON.parse(
            await fs.readFile(
              path.resolve('data/posts.json'),
              'utf8'
            )
          );

          const escapeXml = value =>
            String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&apos;');

          const defaultLastmod =
            posts[0]?.date ||
            new Date()
              .toISOString()
              .slice(0, 10);

          const urls = [
            `  <url><loc>${escapeXml(SITE_URL + '/index.html')}</loc><lastmod>${escapeXml(defaultLastmod)}</lastmod></url>`,
            `  <url><loc>${escapeXml(SITE_URL + '/about.html')}</loc><lastmod>${escapeXml(defaultLastmod)}</lastmod></url>`,
            ...posts.map(
              post =>
                `  <url><loc>${escapeXml(`${SITE_URL}/post.html?slug=${encodeURIComponent(post.slug)}`)}</loc><lastmod>${escapeXml(post.date)}</lastmod></url>`
            )
          ];

          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...urls,
            '</urlset>',
            ''
          ].join('\n');

          await fs.writeFile(
            path.resolve(
              'data/sitemap.xml'
            ),
            xml,
            'utf8'
          );

          console.log(
            `Generated sitemap.xml with ${urls.length} URLs.`
          );
          NODE

      # Step 4: Commit generated files.
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/posts.json data/feed.xml data/sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          git commit -m "chore: update generated blog indexes"
          git push origin HEAD:main
