<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search the article archive.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Search">
  <meta property="og:description" content="Search the article archive.">
  <meta property="og:url" content="/search.html">
  <meta property="og:site_name" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Search">
  <meta name="twitter:description" content="Search the article archive.">
  <title>Search</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css?v=4">
</head>
<body class="search-page" data-page="search">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-name" href="./index.html" data-site-name aria-label="Home"></a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main id="main-content" class="shell page-space search-main">
    <section class="search-hero" aria-labelledby="search-title">
      <p class="eyebrow">Archive</p>
      <h1 id="search-title">Search</h1>
      <label class="search-field search-field-large">
        <span class="visually-hidden">Search posts</span>
        <input id="search-input" type="search" placeholder="Search articles..." autocomplete="off" spellcheck="false" autofocus>
        <kbd aria-hidden="true">Esc</kbd>
      </label>
      <p id="search-hint" class="search-hint">Search across titles, tags, and summaries.</p>
    </section>

    <section aria-labelledby="search-results-title">
      <div class="section-heading-row">
        <h2 id="search-results-title" class="section-title">Results</h2>
        <span id="search-result-count" class="result-count" aria-live="polite"></span>
      </div>
      <div id="search-results" class="post-list" aria-live="polite"></div>
      <div id="search-status" class="status-box" hidden></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© <span data-current-year></span> <span data-site-name></span></p>
      <p data-footer-text>Powered By GlintLog.</p>
      <nav class="social-links" aria-label="Social links" data-social-links hidden></nav>
    </div>
  </footer>

  <!-- TODO: Giscus placeholder. Insert the official Giscus script here after enabling GitHub Discussions. -->
  <!-- TODO: KaTeX placeholder. Load pinned CSS/JS here if mathematical notation becomes necessary. -->
  <script defer src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.1.0/fuse.min.js"></script>
  <script defer src="./js/app.js?v=4"></script>
  <script defer src="./js/search.js?v=4"></script>
</body>
</html>
